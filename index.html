<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f3efe9;--panel:#fffdfb;--ink:#132a38;--muted:#556b75;--line:rgba(19,42,56,.13);--navy:#142e3d;--bronze:#b9775a;--danger:#9d493d;--shadow:0 22px 48px rgba(18,42,56,.08)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:30px 18px 60px;background:linear-gradient(180deg,#f3efe9,#f8f6f3);color:var(--ink);font-family:Manrope,sans-serif}.shell{max-width:980px;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{font-size:2rem;font-weight:800;letter-spacing:-.08em}.brand span{color:var(--bronze)}a{color:var(--navy)}.topbar a{padding:10px 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none}.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:24px}.auth-panel{max-width:460px;margin:8vh auto}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:22px}.eyebrow{display:block;margin:0 0 10px;color:var(--bronze);font:600 .68rem/1.5 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase}h1,h2,h3{margin:0 0 12px;letter-spacing:-.06em}h1{font-size:2.2rem}label{display:block;margin:14px 0 7px;font-size:.8rem;font-weight:700;color:var(--muted)}input,textarea,select{width:100%;margin:0;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:#fdfcfb;color:var(--ink);font:inherit}textarea{min-height:120px;resize:vertical}.button-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}button{border:0;border-radius:999px;padding:12px 18px;font:700 .9rem Manrope,sans-serif;cursor:pointer}.primary{background:var(--navy);color:white}.secondary{background:#e9eef0;color:var(--navy)}.danger{background:#f5e4e1;color:var(--danger)}.message{min-height:24px;margin:14px 0 0;color:var(--danger);font-size:.88rem;font-weight:700}.post-list{display:grid;gap:14px}.post{padding:16px;border:1px solid var(--line);border-radius:17px;background:#f8f7f5}.post h3{font-size:1.12rem}.meta{display:block;margin-bottom:7px;color:#5d7785;font:600 .65rem/1.5 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase}.post p{margin:0;color:var(--muted);line-height:1.55}.post-actions{display:flex;gap:8px;margin-top:12px}.post-actions button{padding:8px 12px;font-size:.8rem}.hidden{display:none!important}.status{margin-top:12px;color:#2e6f4f;font-weight:700}@media(max-width:780px){.grid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}}
    .check-row{display:flex;align-items:center;gap:9px;margin-top:14px}.check-row input{width:18px;height:18px;margin:0;accent-color:var(--navy)}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand">Iqram<span>.</span></div><a href="../index.html">View portfolio</a></header>

    <section id="setup-panel" class="panel auth-panel hidden">
      <span class="eyebrow">One-time setup</span>
      <h1>Connect the admin</h1>
      <p>Set your Supabase URL and anon key in <code>config.js</code>, then reload this page.</p>
    </section>

    <section id="login-panel" class="panel auth-panel hidden">
      <span class="eyebrow">Private workspace</span>
      <h1>Admin sign in</h1>
      <form id="login-form">
        <label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
        <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
        <div class="button-row"><button class="primary" type="submit">Sign in</button></div>
        <p id="login-message" class="message"></p>
      </form>
    </section>

    <main id="app" class="grid hidden">
      <section class="panel">
        <span class="eyebrow">Private workspace</span>
        <h1 id="form-heading">Publish an update</h1>
        <form id="post-form">
          <label for="title">Title</label><input id="title" required>
          <label for="category">Category</label><select id="category"><option>Project</option><option>Workshop</option><option>Research</option><option>Milestone</option><option>Update</option></select>
          <label for="date">Date</label><input id="date" type="date" required>
          <label for="image">Image</label><input id="image" type="file" accept="image/*">
          <label for="caption">Caption</label><textarea id="caption" required></textarea>
          <label class="check-row"><input id="published" type="checkbox" checked> Publish to the main site now</label>
          <div class="button-row"><button class="primary" id="save-post" type="submit">Publish update</button><button class="secondary" id="clear-form" type="button">Clear</button><button class="secondary" id="sign-out" type="button">Sign out</button></div>
          <p id="form-message" class="message"></p><p id="status" class="status"></p>
        </form>
      </section>
      <aside class="panel"><span class="eyebrow">Published items</span><h2>Current updates</h2><div id="post-list" class="post-list"></div></aside>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=2"></script>
  <script src="admin.js?v=2"></script>
</body>
</html>
